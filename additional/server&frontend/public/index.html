<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nucleo Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; width: 80%; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; text-align: center; border-bottom: 4px solid #00adb5; }
        .value { font-size: 2.5rem; font-weight: bold; color: #00adb5; }
        .unit { font-size: 1rem; color: #888; }
        .chart-container { width: 80%; margin-top: 30px; background: #1e1e1e; padding: 20px; border-radius: 10px; }
		#recordBtn {
			margin-top: 20px;
			padding: 15px 30px;
			font-size: 1rem;
			font-weight: bold;
			cursor: pointer;
			border: none;
			border-radius: 5px;
			background-color: #00adb5;
			color: white;
			transition: 0.3s;
		}

		#recordBtn.recording {
			background-color: #ff4d4d;
			animation: pulse 1.5s infinite;
		}

		@keyframes pulse {
			0% { opacity: 1; }
			50% { opacity: 0.7; }
			100% { opacity: 1; }
		}
    </style>
</head>
<body>
    <h1>System Monitorowania Nucleo</h1>
	<button id="recordBtn">Rozpocznij nagrywanie</button>
	<div id="status" style="color: #888; margin-top: 5px; font-size: 0.9rem;">Status: Bezczynny</div>
    <div class="grid">
        <div class="card">
            <div>Temperatura</div>
            <div id="temp" class="value">--</div>
            <span class="unit">°C</span>
        </div>
        <div class="card">
            <div>Nastawa (Setpoint)</div>
            <div id="setpoint" class="value">--</div>
            <span class="unit">°C</span>
        </div>
        <div class="card">
            <div>Moc wentylatora</div>
            <div id="duty" class="value">--</div>
            <span class="unit">%</span>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="tempChart"></canvas>
    </div>

    <script>
	const socket = io();
	let isRecording = false;
	let recordedData = [];

	const recordBtn = document.getElementById('recordBtn');
	const statusText = document.getElementById('status');

	// Funkcja obsługująca przycisk
	recordBtn.onclick = () => {
		if (!isRecording) {
			// START NAGRYWANIA
			recordedData = [];
			recordedData.push("Czas;Temperatura [C];Nastawa [C];Moc [%]");
			
			isRecording = true;
			recordBtn.innerText = "Zatrzymaj i pobierz plik";
			recordBtn.classList.add('recording');
			statusText.innerText = "Status: NAGRYWANIE...";
		} else {
			// STOP NAGRYWANIA
			isRecording = false;
			recordBtn.innerText = "Rozpocznij nagrywanie";
			recordBtn.classList.remove('recording');
			statusText.innerText = "Status: Zapisano " + (recordedData.length - 1) + " pomiarów.";
			downloadFile();
		}
	};

	// Funkcja generująca plik tekstowy
	function downloadFile() {
		const content = recordedData.join("\n");
		const blob = new Blob([content], { type: 'text/plain' });
		const url = window.URL.createObjectURL(blob);
		
		const a = document.createElement('a');
		a.href = url;
		// Nazwa pliku z datą i godziną
		const date = new Date().toISOString().slice(0,19).replace(/:/g, '-');
		a.download = `pomiary_nucleo_${date}.txt`;
		
		document.body.appendChild(a);
		a.click();
		window.URL.revokeObjectURL(url);
		document.body.removeChild(a);
	}

	const ctx = document.getElementById('tempChart').getContext('2d');
	const chart = new Chart(ctx, {
		type: 'line',
		data: {
			labels: [],
			datasets: [{
				label: 'Temperatura [°C]',
				data: [],
				borderColor: '#00adb5',
				tension: 0.4
			}]
		}
	});

	// Odbieranie danych
	socket.on('sensor-data', (data) => {
		const t = data.temp;
		const s = data.setpoint;
		const d = Math.round(data.duty);
		const time = data.time;

		// Aktualizacja UI
		document.getElementById('temp').innerText = t;
		document.getElementById('setpoint').innerText = s;
		document.getElementById('duty').innerText = d;

		// JEŚLI NAGRYWANIE JEST WŁĄCZONE - DODAJ DO TABLICY
		if (isRecording) {
			recordedData.push(`${time};${t};${s};${d}`);
			statusText.innerText = `Status: Zebrano ${recordedData.length - 1} próbek...`;
		}

		// Aktualizacja wykresu
		if (chart.data.labels.length > 20) {
			chart.data.labels.shift();
			chart.data.datasets[0].data.shift();
		}
		chart.data.labels.push(time);
		chart.data.datasets[0].data.push(parseFloat(t));
		chart.update();
	});
    </script>
</body>
</html>
